# Cuts a release when VERSION changes on main.
#
# Produces three artefacts, attached to a GitHub Release tagged v<VERSION>:
#
#   selfcalendar-api-<version>.tar    docker image, loadable with `docker load`
#   selfcalendar-app-<version>.tar    docker image, loadable with `docker load`
#   selfcalendar-<version>.apk        Android build
#
# Both images are tagged twice inside their tar — with the version and with
# `latest` — so `docker load` gives you both refs and an existing
# docker-compose.yml pinned to `latest` picks the new build up without edits.
#
# The version comes from the VERSION file at the repository root, which is
# the single source of truth. The workflow refuses to run if package.json or
# pyproject.toml disagree with it, because a release whose artefacts report
# three different versions is worse than no release.
name: Release

on:
  push:
    branches: [main]
    # Only VERSION changes cut a release. Without this every commit to main
    # would re-run the whole build and then fail on an existing tag.
    paths: ["VERSION"]
  # Manual runs for re-cutting a failed release without touching VERSION.
  workflow_dispatch:

permissions:
  contents: write # required to create the tag and the release

jobs:
  check:
    name: Resolve and validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION and check the others agree
        id: resolve
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"

          if [ -z "$version" ]; then
            echo "::error file=VERSION::VERSION is empty"
            exit 1
          fi
          # Semantic-ish: digits.digits.digits with an optional -suffix.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error file=VERSION::'$version' is not a valid version (expected e.g. 1.2.3 or 1.2.3-rc1)"
            exit 1
          fi

          app_version="$(node -p "require('./app/package.json').version")"
          api_version="$(grep -m1 '^version *= *' api/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"

          fail=0
          [ "$app_version" = "$version" ] || { echo "::error file=app/package.json::version is $app_version, VERSION says $version"; fail=1; }
          [ "$api_version" = "$version" ] || { echo "::error file=api/pyproject.toml::version is $api_version, VERSION says $version"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Refuse to overwrite an existing tag
        run: |
          set -euo pipefail
          tag="v${{ steps.resolve.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists. Bump VERSION rather than re-releasing over it — the old artefacts are already published under that name."
            exit 1
          fi

  images:
    name: Docker images
    needs: check
    runs-on: ubuntu-latest
    strategy:
      # Independent builds; one failing shouldn't cancel the other, so a
      # failure log is available for both.
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
          - name: app
            context: app
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true # into the local daemon, so `docker save` can see it
          tags: |
            selfcalendar-${{ matrix.name }}:${{ needs.check.outputs.version }}
            selfcalendar-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to a tar
        run: |
          set -euo pipefail
          # Both refs in one `docker save` so the tar carries the version tag
          # *and* latest — loading it gives you both, and a compose file
          # pinned to latest picks this build up with no edit.
          docker save \
            -o "selfcalendar-${{ matrix.name }}-${{ needs.check.outputs.version }}.tar" \
            "selfcalendar-${{ matrix.name }}:${{ needs.check.outputs.version }}" \
            "selfcalendar-${{ matrix.name }}:latest"
          ls -lh selfcalendar-${{ matrix.name }}-*.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: selfcalendar-${{ matrix.name }}-*.tar
          retention-days: 1

  apk:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # matches sourceCompatibility in app/build.gradle

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build web assets
        working-directory: app
        run: npm run build

      - name: Sync web assets into the Android project
        working-directory: app
        # Capacitor copies the built web app into android/app/src/main/assets.
        # Without this the APK ships whatever was last synced — usually
        # nothing, giving a blank screen on launch.
        run: npx cap sync android

      - name: Decide signing mode
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            # There is no signingConfig in app/build.gradle, so
            # assembleRelease produces an *unsigned* APK that no device will
            # install. A debug-signed build is at least installable, which
            # makes it a far more useful release artefact than an unsigned
            # one. Add the four secrets below to switch this over.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — building a debug-signed APK. It installs, but it is not suitable for Play or for upgrading an existing release-signed install. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to produce a release build."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore keystore
        if: steps.signing.outputs.mode == 'release'
        working-directory: app/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 -d > release.keystore
          # Never let the decoded key reach a log or an artefact.
          chmod 600 release.keystore

      - name: Build APK
        working-directory: app/android
        env:
          # versionCode must strictly increase for Android to treat a build
          # as an upgrade. Derived from the run number rather than the
          # semantic version: packing 1.2.3 into an integer is easy to get
          # wrong (1.10.0 vs 1.1.0) and impossible to correct once shipped.
          SC_VERSION_CODE: ${{ github.run_number }}
          SC_VERSION_NAME: ${{ needs.check.outputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon \
              -PscVersionCode="$SC_VERSION_CODE" \
              -PscVersionName="$SC_VERSION_NAME" \
              -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            built="app/build/outputs/apk/release/app-release.apk"
          else
            ./gradlew assembleDebug --no-daemon \
              -PscVersionCode="$SC_VERSION_CODE" \
              -PscVersionName="$SC_VERSION_NAME"
            built="app/build/outputs/apk/debug/app-debug.apk"
          fi

          test -f "$built" || { echo "::error::Expected APK at $built"; exit 1; }
          cp "$built" "$GITHUB_WORKSPACE/selfcalendar-${{ needs.check.outputs.version }}.apk"

      - name: Remove the keystore
        if: always() && steps.signing.outputs.mode == 'release'
        working-directory: app/android
        # `always()` so a failed build doesn't leave the decoded key on the
        # runner for whatever runs next.
        run: rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: selfcalendar-*.apk
          retention-days: 1

  release:
    name: Publish release
    needs: [check, images, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what is being published
        run: ls -lh artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Artefacts

            | File | What it is |
            |---|---|
            | `selfcalendar-api-${{ needs.check.outputs.version }}.tar` | API Docker image |
            | `selfcalendar-app-${{ needs.check.outputs.version }}.tar` | Web app Docker image |
            | `selfcalendar-${{ needs.check.outputs.version }}.apk` | Android app |

            ### Deploying the images

            ```bash
            docker load -i selfcalendar-api-${{ needs.check.outputs.version }}.tar
            docker load -i selfcalendar-app-${{ needs.check.outputs.version }}.tar
            docker compose up -d
            ```

            Each tar carries both `:${{ needs.check.outputs.version }}` and
            `:latest`, so a compose file pinned to either works unchanged.

            **Back up `db/prod.db` before upgrading.** The API applies
            database migrations on startup, and some are not reversible.

            The API and the Android app should be updated together — the
            home-screen widget depends on server-side recurrence expansion
            (`GET /event/range?expand=true`), which older API builds do not
            have.
