server {
    listen       80;
    server_name  localhost;

    # Baseline security headers. No Content-Security-Policy here: this
    # image is deployed with an arbitrary, runtime-injected API_BASE_URL
    # (see docker-entrypoint.sh) that a static nginx config can't know
    # ahead of time, so a `connect-src` restrictive enough to be
    # meaningful would need templating this file per-deployment — left
    # for the reverse-proxy work (see review.md) where the API would be
    # same-origin and a real CSP becomes practical.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
