<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Self Calendar</title>
    <!--
      ╔═══════════════════════════════════════════════════════════════╗
      ║  FONTS — Self Calendar uses system fonts only.               ║
      ║  No external network requests, works offline.                ║
      ║                                                               ║
      ║  To change fonts: edit fontDisplay / fontBody / fontMono     ║
      ║  in  src/lib/theme.js  (the single palette + font file).     ║
      ║                                                               ║
      ║  Default stack:                                               ║
      ║    Display → Georgia / system serif                           ║
      ║    Body    → system-ui / -apple-system / Segoe UI            ║
      ║    Mono    → SF Mono / Fira Code / Cascadia Code             ║
      ║                                                               ║
      ║  If you want Google Fonts or a custom web font, add a        ║
      ║  <link> tag here and update theme.js accordingly.            ║
      ╚═══════════════════════════════════════════════════════════════╝
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
